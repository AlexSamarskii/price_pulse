[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pricepulse"
version = "0.1.0"
description = "Local price monitoring with hardened scraper execution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
pricepulse = "pricepulse.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pricepulse*", "migrations*"]

[tool.setuptools.package-data]
"pricepulse.web" = ["templates/**", "static/**"]
